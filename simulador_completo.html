
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador_completo.css">
    <script src="simulador_completo.js" defer></script>
</head>

<body>

    <header>
        <h1>Simulador de Crédito</h1>
    </header>

    <nav>
        <button type="button" onclick="mostrarSeccion('parametros')">
            Parámetros
        </button>

        <button type="button" onclick="mostrarSeccion('clientes')">
            Clientes
        </button>

        <button type="button" onclick="mostrarSeccion('creditos')">
            Créditos
        </button>

        <button type="button" onclick="mostrarSeccion('listaCreditos')">
            Créditos Registrados
        </button>
    </nav>

    <main>

        <!-- SECCIÓN: PARÁMETROS -->
        <section id="parametros" class="activa">
            <h2>Configuración de parámetros</h2>

            <label for="tasaInteres">Tasa de interés (%):</label>
            <input
                type="number"
                id="tasaInteres"
                min="10"
                max="20"
                value="15"
            >

            <button type="button" onclick="guardarTasa()">
                Guardar tasa
            </button>

            <p id="mensajeTasa"></p>
        </section>

        <!-- SECCIÓN: CLIENTES -->
        <section id="clientes">
            <h2>Administración de clientes</h2>

            <div>
                <label for="txtCedula">Cédula:</label>
                <input
                    type="text"
                    id="txtCedula"
                    placeholder="Ingrese la cédula"
                    maxlength="10"
                    inputmode="numeric"
                >
            </div>

            <div>
                <label for="txtNombre">Nombre:</label>
                <input
                    type="text"
                    id="txtNombre"
                    placeholder="Ingrese el nombre"
                >
            </div>

            <div>
                <label for="txtApellido">Apellido:</label>
                <input
                    type="text"
                    id="txtApellido"
                    placeholder="Ingrese el apellido"
                >
            </div>

            <div>
                <label for="txtIngresos">Ingresos mensuales:</label>
                <input
                    type="number"
                    id="txtIngresos"
                    min="0"
                    step="0.01"
                    placeholder="Ejemplo: 1000"
                >
            </div>

            <div>
                <label for="txtEgresos">Egresos mensuales:</label>
                <input
                    type="number"
                    id="txtEgresos"
                    min="0"
                    step="0.01"
                    placeholder="Ejemplo: 600"
                >
            </div>

            <div>
                <button type="button" onclick="guardarCliente()">
                    Guardar cliente
                </button>

                <button type="button" onclick="limpiar()">
                    Limpiar
                </button>
            </div>

            <p id="mensajeCliente"></p>

            <h3>Lista de clientes</h3>

            <table>
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Ingresos</th>
                        <th>Egresos</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaClientes"></tbody>
            </table>
        </section>

        <!-- SECCIÓN: SIMULACIÓN DE CRÉDITO -->
        <section id="creditos">
            <h2>Simulación de Crédito</h2>

            <div class="formulario">
                <label for="txtCedulaCredito">
                    Cédula del cliente:
                </label>

                <input
                    type="text"
                    id="txtCedulaCredito"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Ingresa la cédula"
                >

                <button
                    type="button"
                    onclick="buscarClienteCredito()"
                >
                    Buscar cliente
                </button>
            </div>

            <p id="mensajeCredito"></p>

            <div id="datosClienteCredito"></div>

            <div class="formulario">
                <label for="txtMontoCredito">
                    Monto solicitado ($):
                </label>

                <input
                    type="number"
                    id="txtMontoCredito"
                    min="1"
                    step="0.01"
                    placeholder="Ejemplo: 2000"
                >

                <label for="txtPlazoCredito">
                    Plazo en años:
                </label>

                <input
                    type="number"
                    id="txtPlazoCredito"
                    min="1"
                    step="1"
                    placeholder="Ejemplo: 2"
                >

                <button
                    type="button"
                    onclick="calcularCreditoCliente()"
                >
                    Calcular crédito
                </button>
            </div>

            <div id="resultadoCredito"></div>

            <!-- PASO 2: ASIGNAR CRÉDITO -->
            <button
                type="button"
                id="btnAsignarCredito"
                onclick="asignarCredito()"
                disabled
            >
                Asignar Crédito
            </button>

        </section>

        <!-- PASOS 3 AL 7: HISTORIAL DE CRÉDITOS -->
        <section id="listaCreditos">
            <h2>Créditos Registrados</h2>

            <div class="formulario">
                <label for="buscarCedulaListado">
                    Cédula del cliente:
                </label>

                <input
                    type="text"
                    id="buscarCedulaListado"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Ingrese la cédula"
                >

                <button
                    type="button"
                    onclick="buscarCreditosCliente()"
                >
                    Buscar créditos
                </button>

                <button
                    type="button"
                    onclick="pintarCreditos(creditos)"
                >
                    Ver todos los créditos
                </button>
            </div>

            <p id="mensajeHistorial"></p>

            <table>
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Monto</th>
                        <th>Tasa</th>
                        <th>Plazo</th>
                        <th>Cuota</th>
                    </tr>
                </thead>

                <tbody id="tablaCreditos"></tbody>
            </table>

        </section>

    </main>

</body>

</html>
