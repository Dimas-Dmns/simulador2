
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Crédito</title>

    <link rel="stylesheet" href="simulador_completo.css">

    <script src="simulador_completo.js" defer></script>
</head>

<body>

    <header>
        <h1>Simulador de Crédito</h1>
    </header>

    <nav>
        <button type="button" onclick="mostrarSeccion('parametros')">
            Parámetros
        </button>

        <button type="button" onclick="mostrarSeccion('clientes')">
            Clientes
        </button>

        <button type="button" onclick="mostrarSeccion('creditos')">
            Créditos
          </button>
    </nav>

    <main>

        <!-- PARTE 1 Y PARTE 2: NAVEGACIÓN Y TASA -->
        <section id="parametros" class="activa">

            <h2>Configuración de parámetros</h2>

            <label for="tasaInteres">Tasa de interés (%):</label>

            <input
                type="number"
                id="tasaInteres"
                min="10"
                max="20"
                value="15"
            >

            <button type="button" onclick="guardarTasa()">
                Guardar tasa
            </button>

            <p id="mensajeTasa"></p>

        </section>

        <!-- PARTE 3: ADMINISTRACIÓN DE CLIENTES -->
        <section id="clientes">

            <h2>Administración de clientes</h2>

            <div>
                <label for="txtCedula">Cédula:</label>

                <input
                    type="text"
                    id="txtCedula"
                    placeholder="Ingrese la cédula"
                    maxlength="10"
                    inputmode="numeric"
                >
            </div>

            <div>
                <label for="txtNombre">Nombre:</label>

                <input
                    type="text"
                    id="txtNombre"
                    placeholder="Ingrese el nombre"
                >
            </div>

<label for="txtApellido">Apellido:</label>
<input
    type="text"
    id="txtApellido"
    placeholder="Ingresa el apellido"
>

<label for="txtIngresos">Ingresos mensuales:</label>
<input
    type="number"
    id="txtIngresos"
    min="0"
    step="0.01"
    placeholder="Ejemplo: 1000"
>

<label for="txtEgresos">Egresos mensuales:</label>
<input
    type="number"
    id="txtEgresos"
    min="0"
    step="0.01"
    placeholder="Ejemplo: 600"
>
            <div>
                <button type="button" onclick="guardarCliente()">
                    Guardar cliente
                </button>

                <button type="button" onclick="limpiar()">
                    Limpiar
                </button>
            </div>

            <p id="mensajeCliente"></p>

            <h3>Lista de clientes</h3>

            <table>
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaClientes">
                </tbody>
            </table>

        </section>
        <section id="creditos">
    <h2>Simulación de Crédito</h2>

    <div class="formulario">
        <label for="txtCedulaCredito">Cédula del cliente:</label>
        <input
            type="text"
            id="txtCedulaCredito"
            maxlength="10"
            placeholder="Ingresa la cédula"
        >

        <button type="button" onclick="buscarClienteCredito()">
            Buscar cliente
        </button>
    </div>

    <p id="mensajeCredito"></p>

    <div id="datosClienteCredito"></div>

    <div class="formulario">
        <label for="txtMontoCredito">Monto solicitado ($):</label>
        <input
            type="number"
            id="txtMontoCredito"
            min="1"
            placeholder="Ejemplo: 2000"
        >

        <label for="txtPlazoCredito">Plazo en años:</label>
        <input
            type="number"
            id="txtPlazoCredito"
            min="1"
            placeholder="Ejemplo: 2"
        >

        <button type="button" onclick="calcularCreditoCliente()">
            Calcular crédito
        </button>
    </div>

    <div id="resultadoCredito"></div>
</section>

    </main>

</body>

</html>
